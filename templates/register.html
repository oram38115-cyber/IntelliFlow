
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | IntelliFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">

    <div class="auth-card">
        <h1 class="auth-logo">✦ IntelliFlow</h1>
        <h2>Create your account</h2>
        <p class="auth-subtitle">Start managing your work intelligently.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="auth-message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Minimum 8 characters" minlength="8" required>

            <button type="submit" class="auth-button">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>

</body>
</html>
